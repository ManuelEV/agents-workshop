<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Taller visual e interactivo: cómo funcionan los agentes de IA por dentro. Tokens, embeddings, RAG, herramientas, memoria, MCP, A2A, guardrails y observabilidad con animaciones y datos simulados." />
    <meta name="theme-color" content="#0a0e1a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Agents Workshop · Agentes por dentro</title>
    <script>
      try {
        const t = localStorage.getItem('theme')
        const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch { document.documentElement.dataset.theme = 'dark' }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
